spring.main.allow-circular-references=true

# ===============================
# DATABASE CONFIG (MySQL)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/expensetracker?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=YOUR_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# JWT CONFIG
# ===============================
app.jwtSecret=YOUR_PASSWORD
app.jwtExpirationMs=86400000

# ===============================
# MAIL CONFIG (DUMMY - REQUIRED)
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=YOUR_EMAIL
spring.mail.password=YOUR_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# OTHER SETTINGS
# ===============================
app.verificationCodeExpirationMs=60000
app.user.profile.upload.dir=./uploads/user/profile

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB